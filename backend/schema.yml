      tags:
      - Todos
      - Statistics
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  range_0_20:
                    type: integer
                  range_21_40:
                    type: integer
                  range_41_60:
                    type: integer
                  range_61_80:
                    type: integer
                  range_81_100:
                    type: integer
          description: ''
  /api/v1/todos/search/:
    get:
      operationId: todos_search_retrieve
      description: "\n        自然言語でTodoを検索します。\n        \n        Google Gemini APIによるベクトル検索を使用し、\n
        \       「明日の会議関連」などの曖昧な検索が可能です。\n        "
      summary: セマンティック検索
      parameters:
      - in: query
        name: min_score
        schema:
          type: number
          format: double
        description: '最小類似度スコア（デフォルト: 0.5、範囲: 0.0-1.0）'
      - in: query
        name: q
        schema:
          type: string
        description: '検索クエリ（例: "明日の会議関連"）'
        required: true
      - in: query
        name: top_k
        schema:
          type: integer
        description: '取得件数（デフォルト: 5、最大: 20）'
      tags:
      - Todos
      - Search
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        score:
                          type: number
                        todo_title:
                          type: string
                  count:
                    type: integer
              examples:
                Success:
                  value:
                    query: 明日の会議
                    results:
                    - id: 1
                      score: 0.95
                      todo_title: 会議資料作成
                    count: 1
          description: ''
  /api/v1/todos/stats/:
    get:
      operationId: todos_stats_retrieve
      description: 優先度ごとのTodo件数を取得します。Redisキャッシュを使用（15分間）。
      summary: 優先度別統計
      tags:
      - Todos
      - Statistics
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    priority:
                      type: string
                    count:
                      type: integer
          description: ''
  /api/v1/webhooks/send-welcome-email:
    post:
      operationId: webhooks_send_welcome_email_create
      description: "\n        QStashから呼ばれる内部エンドポイント。直接呼び出し不可。\n        \n        **セキュリティ:**\n
        \       - QStash署名検証（HMAC-SHA256）\n        - IPアドレス制限なし（署名のみで認証）\n        \n
        \       **リトライ:**\n        - QStashが自動リトライ（最大3回）\n        - 5秒、10秒、15秒の間隔\n
        \       \n        **エラー時の動作:**\n        - 500エラー: QStashが自動リトライ\n        -
        400エラー: リトライなし（データ不正）\n        "
      summary: '[内部API] ウェルカムメール送信'
      tags:
      - Internal
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WelcomeEmailWebhookRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WelcomeEmailWebhookRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WelcomeEmailWebhookRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  message_id:
                    type: string
              examples:
                Success:
                  value:
                    message: Email sent successfully
                    message_id: re_abc123xyz
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: array
                    items:
                      type: string
                  first_name:
                    type: array
                    items:
                      type: string
              examples:
                BadRequest:
                  value:
                    email:
                    - この項目は必須です。
                    first_name:
                    - この項目は必須です。
                  summary: Bad Request
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              examples:
                Unauthorized:
                  value:
                    detail: QStash署名検証に失敗しました。
          description: ''
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  detail:
                    type: string
              examples:
                InternalServerError:
                  value:
                    error: email_delivery_error
                    detail: メール送信に失敗しました。
                  summary: Internal Server Error
          description: ''
components:
  schemas:
    CustomRegister:
      type: object
      description: |-
        emailベース認証用のカスタム登録シリアライザ

        - usernameフィールドを削除（emailを主キーとして使用）
        - first_name/last_nameフィールドを追加
        - サービス層経由でユーザー作成

        エラーハンドリング:
            - メールアドレス重複: UserAlreadyExistsError → 統一エラーハンドラーが処理
            - その他のエラー: 統一エラーハンドラーが処理
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
          description: ユーザーの名
          maxLength: 150
        last_name:
          type: string
          description: ユーザーの姓
          maxLength: 150
      required:
      - email
    CustomRegisterRequest:
      type: object
      description: |-
        emailベース認証用のカスタム登録シリアライザ

        - usernameフィールドを削除（emailを主キーとして使用）
        - first_name/last_nameフィールドを追加
        - サービス層経由でユーザー作成

        エラーハンドリング:
            - メールアドレス重複: UserAlreadyExistsError → 統一エラーハンドラーが処理
            - その他のエラー: 統一エラーハンドラーが処理
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password1:
          type: string
          writeOnly: true
          minLength: 1
        password2:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          description: ユーザーの名
          maxLength: 150
        last_name:
          type: string
          description: ユーザーの姓
          maxLength: 150
      required:
      - email
      - password1
      - password2
    CustomUser:
      type: object
      description: |-
        現在のユーザー情報を返すシリアライザ

        読み取り専用フィールド:
            - id: ユーザーID
            - email: メールアドレス
            - is_staff: スタッフ権限
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: メールアドレス
        first_name:
          type: string
          title: 名
          maxLength: 150
        last_name:
          type: string
          title: 姓
          maxLength: 150
        is_staff:
          type: boolean
          readOnly: true
          title: スタッフ権限
          description: ユーザーが管理サイトにログイン可能かどうかを示します。
      required:
      - email
      - id
      - is_staff
    CustomUserRequest:
      type: object
      description: |-
        現在のユーザー情報を返すシリアライザ

        読み取り専用フィールド:
            - id: ユーザーID
            - email: メールアドレス
            - is_staff: スタッフ権限
      properties:
        first_name:
          type: string
          title: 名
          maxLength: 150
        last_name:
          type: string
          title: 姓
          maxLength: 150
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - password
    PasswordChangeRequest:
      type: object
      properties:
        new_password1:
          type: string
          minLength: 1
          maxLength: 128
        new_password2:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - new_password1
      - new_password2
    PasswordResetConfirmRequest:
      type: object
      description: Serializer for confirming a password reset attempt.
      properties:
        new_password1:
          type: string
          minLength: 1
          maxLength: 128
        new_password2:
          type: string
          minLength: 1
          maxLength: 128
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - new_password1
      - new_password2
      - token
      - uid
    PasswordResetRequest:
      type: object
      description: Serializer for requesting a password reset e-mail.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedCustomUserRequest:
      type: object
      description: |-
        現在のユーザー情報を返すシリアライザ

        読み取り専用フィールド:
            - id: ユーザーID
            - email: メールアドレス
            - is_staff: スタッフ権限
      properties:
        first_name:
          type: string
          title: 名
          maxLength: 150
        last_name:
          type: string
          title: 姓
          maxLength: 150
    PatchedTodoRequest:
      type: object
      description: |-
        Todoの作成・更新用シリアライザー

        - userはread_only（API側でログインユーザーを自動紐付け）
        - バリデーションエラーは統一エラーハンドラーで処理
      properties:
        todo_title:
          type: string
          minLength: 1
          maxLength: 255
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        progress:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
    PriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      type: string
      description: |-
        * `LOW` - 低
        * `MEDIUM` - 中
        * `HIGH` - 高
    RestAuthDetail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    Todo:
      type: object
      description: |-
        Todoの作成・更新用シリアライザー

        - userはread_only（API側でログインユーザーを自動紐付け）
        - バリデーションエラーは統一エラーハンドラーで処理
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          format: email
          title: メールアドレス
          readOnly: true
        todo_title:
          type: string
          maxLength: 255
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        progress:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - todo_title
      - updated_at
      - user
    TodoRequest:
      type: object
      description: |-
        Todoの作成・更新用シリアライザー

        - userはread_only（API側でログインユーザーを自動紐付け）
        - バリデーションエラーは統一エラーハンドラーで処理
      properties:
        todo_title:
          type: string
          minLength: 1
          maxLength: 255
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        progress:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - todo_title
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    WelcomeEmailWebhookRequest:
      type: object
      description: |-
        ウェルカムメール送信Webhookのペイロードバリデーション

        QStashから呼ばれるWebhook用のバリデーター
      properties:
        email:
          type: string
          format: email
          minLength: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 150
      required:
      - email
      - first_name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jwtCookieAuth:
      type: apiKey
      in: cookie
      name: access-token
    jwtHeaderAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
