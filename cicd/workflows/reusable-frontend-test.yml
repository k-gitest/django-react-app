name: Reusable Frontend Tests

on:
  workflow_call:
    inputs:
      environment:
        description: Environment name (staging/production)
        required: true
        type: string
      strict-mode:
        description: Fail on linting errors
        required: false
        type: boolean
        default: false
      coverage-threshold:
        description: Minimum test coverage percentage
        required: false
        type: number
        default: 0

env:
  NODE_VERSION: '20'

jobs:
  # 最初に型を生成するジョブ
  prepare-types:
    name: Prepare API Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend

      # バックエンドのスキーマをダウンロード
      - name: Download OpenAPI Schema
        uses: actions/download-artifact@v4
        with:
          name: openapi-schema-${{ github.sha }}
          path: .  # ルートディレクトリにダウンロード

      # スキーマの存在確認
      - name: Verify Schema Download
        run: |
          if [ ! -f schema.yml ]; then
            echo "❌ Schema file not found after download"
            echo "Contents of current directory:"
            ls -la
            exit 1
          fi
          echo "✅ Schema file found"
          echo "Schema size: $(du -h schema.yml | cut -f1)"

      # ===== TypeScript型定義を生成 =====
      - name: Generate TypeScript Types
        run: |
          npx openapi-typescript ../schema.yml -o src/types/api.d.ts
          
          # 型定義が正しく生成されたか確認
          if [ ! -f src/types/api.d.ts ]; then
            echo "❌ TypeScript types generation failed"
            exit 1
          fi
          
          echo "✅ TypeScript types generated successfully"
          echo "Types file size: $(du -h src/types/api.d.ts | cut -f1)"
        working-directory: frontend

      # 型定義の差分チェック
      - name: Check API Types Sync
        run: |
          cd frontend
          
          if git diff --exit-code src/types/api.d.ts; then
            echo "✅ API types are up to date" | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "### 🔄 API Types Changed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following types were updated from the OpenAPI schema:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>View Diff</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
            git diff src/types/api.d.ts >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            
            # Productionでは厳密にチェック
            if [ "${{ inputs.environment }}" == "production" ] && [ "${{ inputs.strict-mode }}" == "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "❌ **Error:** API types must be committed before production deployment" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Please run: \`npm run generate:api\` and commit the changes" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            
            # Stagingでは警告のみ
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Warning:** Consider updating the committed types by running:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "npm run generate:api" >> $GITHUB_STEP_SUMMARY
            echo "git add src/types/api.d.ts" >> $GITHUB_STEP_SUMMARY
            echo "git commit -m 'chore: update API types'" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: ${{ inputs.environment == 'staging' }}

      # 生成した型定義をアップロード
      - name: Upload Generated Types
        uses: actions/upload-artifact@v4
        with:
          name: api-types-${{ github.sha }}
          path: frontend/src/types/api.d.ts
          retention-days: 1
          if-no-files-found: error

  lint:
    needs: prepare-types
    name: Lint & Format
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          working-directory: frontend

      - name: Download Types
        uses: actions/download-artifact@v4
        with:
          name: api-types-${{ github.sha }}
          path: frontend/src/types/
      
      - name: Run ESLint
        run: npm run lint
        working-directory: frontend
        continue-on-error: ${{ !inputs.strict-mode }}
      
      - name: Run Prettier
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css,json}"
        working-directory: frontend
        continue-on-error: ${{ !inputs.strict-mode }}

  typecheck:
    needs: prepare-types
    name: TypeScript Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Download Types
        uses: actions/download-artifact@v4
        with:
          name: api-types-${{ github.sha }}
          path: frontend/src/types/
      
      - name: Run TypeScript compiler
        run: npx tsc --noEmit
        working-directory: frontend

  test:
    needs: prepare-types
    name: Run Tests
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Download Types
        uses: actions/download-artifact@v4
        with:
          name: api-types-${{ github.sha }}
          path: frontend/src/types/
      
      - name: Run tests
        run: npm run test -- --coverage --watchAll=false
        working-directory: frontend
        env:
          VITE_BASE_API_URL: ${{ vars.VITE_BASE_API_URL }}
      
      - name: Check coverage threshold
        if: inputs.coverage-threshold > 0
        run: |
          COVERAGE=$(cat frontend/coverage/coverage-summary.json | jq '.total.lines.pct')
          if (( $(echo "$COVERAGE < ${{ inputs.coverage-threshold }}" | bc -l) )); then
            echo "❌ Coverage ($COVERAGE%) is below threshold (${{ inputs.coverage-threshold }}%)"
            exit 1
          fi
          echo "✅ Coverage is sufficient: $COVERAGE%"
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend-${{ inputs.environment }}
          name: frontend-${{ inputs.environment }}-coverage
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Download Types
        uses: actions/download-artifact@v4
        with:
          name: api-types-${{ github.sha }}
          path: frontend/src/types/
      
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_BASE_API_URL: ${{ vars.VITE_BASE_API_URL }}
          NODE_ENV: ${{ inputs.environment }}
      
      - name: Check build output
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          
          echo "✅ Build successful"
          echo "Build size: $(du -sh frontend/dist | cut -f1)"
          
          # Productionビルドの検証
          if [ "${{ inputs.environment }}" == "production" ]; then
            if find dist -name "*.map" | grep -q .; then
              echo "⚠️  Warning: Source maps found in production build"
            fi
            
            # index.htmlの存在確認
            if [ ! -f "dist/index.html" ]; then
              echo "❌ index.html not found in build output"
              exit 1
            fi
          fi
        working-directory: frontend
      
      - name: Upload build artifacts
        if: inputs.environment == 'production' || inputs.environment == 'staging'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ inputs.environment }}-build-${{ github.sha }}
          path: frontend/dist
          retention-days: 30
          if-no-files-found: error

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit
        run: |
          if [ "${{ inputs.strict-mode }}" == "true" ]; then
            npm audit --audit-level=high
          else
            npm audit --audit-level=moderate
          fi
        working-directory: frontend
        continue-on-error: ${{ !inputs.strict-mode }}