schema: 
  - ../schema.graphql
  - | # 仮想的にスカラー定義を追加
      scalar GlobalID
      scalar DateTime
      scalar Date
documents: 'src/graphql/**/*.ts'
generates:
  src/graphql/types.ts:
    plugins:
      - typescript
      - typescript-operations
    config:
      # 設定オプション
      skipTypename: false
      withHooks: false
      withComponent: false
      scalars:
        DateTime: string
        GlobalID: string
        Date: string
      # ✅ enum ではなく type Priority = 'HIGH' | 'LOW' ... 形式で出力する
      enumsAsTypes: true